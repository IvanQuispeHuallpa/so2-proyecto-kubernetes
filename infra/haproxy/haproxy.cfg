# Balanceador del API de Kubernetes (lb01 y lb02).
# Requiere net.ipv4.ip_nonlocal_bind=1 para que el nodo pasivo pueda enlazar la VIP.
global
    log /dev/log local0
    maxconn 2000
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend k8s-api
    bind 10.10.20.10:6443
    default_backend k8s-cp

backend k8s-cp
    balance roundrobin
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server cp01 10.10.20.21:6443 check
    server cp02 10.10.20.22:6443 check
    server cp03 10.10.20.23:6443 check
