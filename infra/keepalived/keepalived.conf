# VIP del API de Kubernetes (10.10.20.10). Valores para lb01; en lb02 usar state BACKUP y priority 100.
vrrp_script chk_haproxy {
    script "/usr/bin/pidof haproxy"
    interval 2
    weight -20
}

vrrp_instance VI_API {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 110
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CAMBIAR_SECRETO   # definir fuera del repositorio (p. ej. con Ansible Vault)
    }
    virtual_ipaddress {
        10.10.20.10/24
    }
    track_script {
        chk_haproxy
    }
}
